<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>這里需要你</title>
<meta name="description" content="以里為單位，看見需要的長輩：臺北市 456 里的高齡社區韌性儀表板">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版型來自「這里需要你」交接包（LAYOUT.md）；資料改用本專案臺北市 456 里開放資料 */
:root{
  --ink:#211D1D; --ink-2:#4A3F3A; --sub:#6E5950; --muted:#7A655C;
  --brand:#AD4D2A; --brand-deep:#963F24; --brand-text:#B5532F; --orange:#DB6A41; --yellow:#FCEA8B; --gold:#C9A92E;
  --bg:#FFF8F4; --card:#FFFFFF; --line:#EFE3DA; --track:#F3ECE6; --chip:#E8E1D8; --border:#D9D4CC;
  --tint-red:#FBEDE7; --tint-yellow:#FEF6D8; --on-dark:#FFE9DC;
  --lv-red:#963F24; --lv-yellow:#DB6A41; --lv-green:#FCEA8B; --lv-none:#E2DCD5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
a{color:var(--brand)}a:hover{color:#7F3518}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #211D1D;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:22px}
.tag-sim{font-size:11px;font-weight:700;color:var(--sub);border:1.5px dashed #B9A79C;padding:1px 6px;border-radius:6px;white-space:nowrap}
.tag-est{font-size:11px;font-weight:700;color:#8C3E1F;background:#FDEEE6;padding:2px 6px;border-radius:6px;white-space:nowrap}
.tag-real{font-size:11px;font-weight:700;color:var(--ink-2);background:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap}
.pill{min-height:44px;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.mark{background:linear-gradient(transparent 55%,var(--yellow) 55%);color:var(--ink);padding:0 3px}
.nowrap{white-space:nowrap}
.zl-map path.hit{cursor:pointer;transition:opacity .15s}
.zl-map path.hit:hover{opacity:.78}
.crumb{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer;min-height:32px}
.stage{position:relative;min-height:660px;border-radius:20px;background:var(--bg);overflow:hidden}
.layer{position:absolute;inset:70px 330px 90px 20px;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.layer.is-off{opacity:0;pointer-events:none}
.layer.city.is-off{transform:scale(1.25)} .layer.vil.is-off{transform:scale(.8)}
.float{position:absolute;z-index:2;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(33,29,29,.14);animation:zlFloat 6s ease-in-out infinite}
.slot{position:absolute;z-index:3;right:20px;bottom:20px;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.slot.is-off{opacity:0;transform:translateY(40px);pointer-events:none}
@keyframes zlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sec{position:relative;overflow:hidden;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:90px}
.sec>*{position:relative}
.anim .sec{animation:zlUp .7s cubic-bezier(.2,.8,.2,1) both}
.ghost{position:absolute!important;right:20px;top:-18px;font-size:140px;font-weight:900;line-height:1;color:rgba(173,77,42,.08);pointer-events:none;letter-spacing:-.04em}
@keyframes zlUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.lift{transition:transform .2s ease,box-shadow .2s ease}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(33,29,29,.13)}
.jump a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.jump a:hover{background:var(--tint-red);color:var(--ink)}
.ins{border-radius:14px;transition:background .2s}
.ins:hover{background:rgba(255,255,255,.55)}
.dot{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ins:hover .dot{transform:rotate(-10deg) scale(1.1)!important}
.grow{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bub{animation:zlUp .5s cubic-bezier(.2,.8,.2,1) both}
.sec-head{display:flex;align-items:center;gap:16px}
.sec-icon{width:58px;height:58px;border-radius:18px;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.eyebrow{font-size:13px;font-weight:900;letter-spacing:.14em}
.h2{margin:0;font-size:28px;font-weight:900}
.cols{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.col-all{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px}
.form{flex:1 1 360px;min-width:0;background:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 30px rgba(150,120,20,.14)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:15px;font-weight:900;padding:0;margin-bottom:10px}
.hint{font-size:12px;font-weight:400;color:var(--sub)}
.sel{min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);font-size:16px;background:#fff;color:var(--ink);max-width:100%}
.src{background:#fff;border-radius:16px;padding:6px 20px}
.src summary{cursor:pointer;font-weight:900;font-size:16px;min-height:44px;display:flex;align-items:center}
.src table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px}
.src th,.src td{text-align:left;padding:8px 6px;border-top:1px solid var(--track);vertical-align:top}
.src th{color:var(--sub);font-weight:700}
.tblw{overflow-x:auto}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.float,.anim .sec,.bub,.grow{animation:none}.layer,.slot{transition:none}.lift:hover{transform:none}}
@media (max-width: 860px){
  .stage{min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px}
  .layer,.float,.slot{position:static!important;width:auto!important;animation:none;transform:none!important;opacity:1!important}
  .layer.is-off,.slot.is-off{display:none}
  .ghost{font-size:90px}
  .sec{padding:20px}
  .h2{font-size:24px}
}
</style>
</head>
<body class="anim">
<div class="wrap" id="app"></div>
<script>
/* ===== 資料：analysis/build_page.py 內嵌，請勿手改 =====
   LI：臺北市 456 里（analysis/output/taipei_li_full.json）
   MAP：12 區與 456 里界的 SVG 路徑（analysis/build_map.js，內政部國土測繪中心村里界） */
const LI=/*__LI__*/null;
const MAP=/*__MAP__*/null;

/* ===== 小工具 ===== */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isN=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(v);
const fmt=n=>isN(n)?Math.round(n).toLocaleString('zh-TW'):'—';
const f1=n=>isN(n)?(+n).toFixed(1):'—';
const mask=n=>isN(n)?(n>0&&n<3?'—':fmt(n)):'—';
const median=a=>{const s=a.filter(isN).sort((x,y)=>x-y),m=s.length>>1;return s.length?(s.length%2?s[m]:(s[m-1]+s[m])/2):null};
const sum=(a,f)=>a.reduce((s,x)=>s+(isN(f(x))?f(x):0),0);
const key=r=>r.d+'|'+r.v;
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function linProj(a,n){const k=a.length,mx=(k-1)/2,my=a.reduce((p,q)=>p+q,0)/k;let nu=0,de=0;a.forEach((v,i)=>{nu+=(i-mx)*(v-my);de+=(i-mx)**2});const b=nu/de;return Array.from({length:n},(_,i)=>my+b*(k-1+i+1-mx))}

const LV={'需要關注':'var(--lv-red)','留意':'var(--lv-yellow)','穩定':'var(--lv-green)','資料不足':'var(--lv-none)'};
const LVINK={'需要關注':'#fff','留意':'#211D1D','穩定':'#211D1D','資料不足':'#4A3F3A'};
const badge=(lv,size)=>`<span style="font-size:${size||12}px;font-weight:700;padding:3px 10px;border-radius:999px;background:${LV[lv]};color:${LVINK[lv]};white-space:nowrap${lv==='穩定'?';box-shadow:inset 0 0 0 1px var(--gold)':''}">${esc(lv)}</span>`;
const dot=lv=>`<span aria-hidden="true" style="width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:${LV[lv]}${lv==='穩定'?';box-shadow:inset 0 0 0 1.5px var(--gold)':''}"></span>`;
const lvByShare=x=>x>=.25?'需要關注':x>=.12?'留意':'穩定';
const TAG={real:'',est:'<span class="tag-est">推估</span>',sim:'<span class="tag-sim">模擬</span>'};

const ICON={
  users:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 .2 5.5 2.3 5.5 5.8"/></svg>',
  shield:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  bulb:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  spark:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>',
  heart:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  chat:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  down:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>'
};
const heart=(size,fill)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill||'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;

/* ===== 指標（只放有里級資料的項目；其他列在「待機關提供」） =====
   hw：數值越高越不利；st：real 開放資料、est 推估 */
// 失智：衛福部 109–112 年全國社區失智症流行病學調查年齡別盛行率（65–69 2.40%、70–74 5.16%、75–79 9.10%、80–84 16.00%、85+ 23.23%）
// 里級人口只到 65–74、75–79、80–89、90+，65–74 與 80–89 取兩個年齡組的平均盛行率
const DEMR={a6574:(2.40+5.16)/2/100,a7579:.0910,a8089:(16.00+23.23)/2/100,a90:.2323};
function demN(r){const a90=r.am[9]+r.am[10]+r.af[9]+r.af[10],a8089=r.e80-a90,a7579=r.e65-r.e6574-r.e80;
  return r.e6574*DEMR.a6574+a7579*DEMR.a7579+a8089*DEMR.a8089+a90*DEMR.a90}
const IND=[
 {id:'dem',k:'health',g:'健康狀況',n:'失智長輩',u:'%',hw:1,st:'est',c:r=>demN(r)/r.e65*100,t:(v,r)=>`約 ${fmt(demN(r))} 人・${f1(v)}%`,m:v=>f1(v)+'%',note:'依年齡分層推估',
  src:'衛福部 109–112 年全國社區失智症流行病學調查（年齡別盛行率）× 本里 65 歲以上各年齡人口',f:'65–74 歲 × 3.78%＋75–79 歲 × 9.10%＋80–89 歲 × 19.62%＋90 歲以上 × 23.23%，÷ 65 歲以上'},
 {id:'liq',k:'safe',g:'環境安全',n:'土壤液化中高潛勢面積比',u:'%',hw:1,st:'real',c:r=>r.liq,src:'臺北市土壤液化潛勢圖（soil.taipei，2019）',f:'里內中、高潛勢面積 ÷ 里面積'},
 {id:'fl',k:'safe',g:'環境安全',n:'極端降雨積水面積比',u:'%',hw:1,st:'real',c:r=>r.fl130,src:'臺北市降雨積水模擬圖（112 年更新版，data.taipei）',f:'時雨量 130 mm 可能積水範圍 ÷ 里面積'},
 {id:'shade',k:'safe',g:'環境安全',n:'人行道缺樹蔭比例',u:'%',hw:1,st:'est',c:r=>r.shade,src:'行道樹、公園樹木、人行道（走這條，一路順！分析，樹冠寬推估 8 m）',f:'人行道未被樹冠覆蓋的比例；人行道少於 500 m 的里不計'},
 {id:'shel',k:'safe',g:'避難與設施',n:'每千位長輩避難收容容量',u:' 人',hw:0,st:'real',c:r=>r.e65?r.shCap/r.e65*1000:null,t:v=>fmt(v)+' 人',src:'114 年臺北市可供避難收容處所一覽表（data.taipei）',f:'服務本里的收容人數（多里共用時平均分攤）÷ 65 歲以上 × 1000'},
 {id:'wc',k:'safe',g:'避難與設施',n:'500m 內公廁',u:' 處',hw:0,st:'real',c:r=>r.wcN,src:'臺北市公廁點位資訊（data.taipei）',f:'里代表點 500 公尺內公廁數'},
 {id:'wcA',k:'safe',g:'避難與設施',n:'500m 內無障礙廁座',u:' 座',hw:0,st:'real',c:r=>r.wcA,src:'臺北市公廁點位資訊（data.taipei）',f:'里代表點 500 公尺內無障礙廁座數'},
 {id:'acc',k:'safe',g:'交通安全',n:'長者行人事故（每千位長輩，三年）',u:'',hw:1,st:'real',c:r=>r.e65?r.acc/r.e65*1000:null,t:(v,r)=>`${f1(v)}・${r.acc} 件`,m:v=>f1(v),src:'臺北市警察局死傷交通事故明細、警政署 A1／A2（2023–2025）',f:'三年 65 歲以上行人被撞事故 ÷ 65 歲以上 × 1000'},
 {id:'bus',k:'safe',g:'交通安全',n:'500m 內公車站與捷運出入口',u:' 處',hw:0,st:'real',c:r=>r.bus,src:'臺北市公車站牌位置、臺北捷運出入口座標（data.taipei）',f:'里代表點 500 公尺內公車站位＋捷運出入口數'},
 {id:'busD',k:'safe',g:'交通安全',n:'公車站密度（每平方公里）',u:' 站',hw:0,st:'real',c:r=>r.area?r.busIn/r.area:null,src:'臺北市公車站牌位置（data.taipei）× 村里界',f:'里內公車站位數 ÷ 里面積'},
 {id:'care',k:'part',g:'社會參與',n:'每千位長輩社區關懷據點',u:' 處',hw:0,st:'real',c:r=>r.e65?r.careN/r.e65*1000:null,t:(v,r)=>`${r.careN} 處・每千人 ${f1(v)}`,m:v=>'每千人 '+f1(v),src:'社會局社區照顧關懷據點（data.taipei，依地址里名）',f:'里內關懷據點數 ÷ 65 歲以上 × 1000'},
 {id:'wifi',k:'part',g:'數位',n:'Taipei Free 熱點',u:' 處',hw:0,st:'real',c:r=>r.wifi,src:'臺北市公眾區免費無線上網熱點（data.taipei）',f:'里界內 Taipei Free 熱點數'}
];
const PENDING={
 health:['失能長輩（長照管理中心）','身障長輩（社會局）','500m 內醫療院所（健保署）','長照使用率（衛生局）','健檢、癌篩、流感接種率（衛生局）'],
 safe:['低收及中低收入戶占率（社會局）','詐騙、犯罪（警察局）','老舊公寓占率（稅務局）'],
 part:['長輩志工率（社會局）','終身學習參與（社會局、教育局）','健康存摺使用率（健保署）']
};
const FACET={health:'健康',safe:'安全',part:'參與'};
const FKEYS=['health','safe','part'];
const INDM=Object.fromEntries(IND.map(i=>[i.id,i]));

/* ===== 計算 ===== */
const ALL=LI;
ALL.forEach(r=>{r.key=key(r);r.V={};IND.forEach(i=>{const v=i.c(r);r.V[i.id]=isN(v)?v:null});
  r.f80=r.af[8]+r.af[9]+r.af[10];r.proj=r.t65&&r.t65.length>=2?linProj(r.t65,5)[4]:null});
const MED={};IND.forEach(i=>MED[i.id]=median(ALL.map(r=>r.V[i.id])));
// 風險位階（與 v2.5.1 相同算法）：用來排全市優先序
const RISK={};IND.forEach(i=>{RISK[i.id]=ALL.map(r=>r.V[i.id]).filter(isN).map(v=>i.hw?v:-v).sort((a,b)=>a-b)});
function riskPos(i,v){const arr=RISK[i.id];if(!isN(v)||!arr.length)return null;const rv=i.hw?v:-v;let lo=0,eq=0;for(const a of arr){if(a<rv)lo++;else if(a===rv)eq++}return(lo+eq/2)/arr.length}
function items(r,k){return IND.filter(i=>i.k===k&&isN(r.V[i.id])).map(i=>{const v=r.V[i.id],m=MED[i.id];
  return{i,v,m,worse:i.hw?v>m:v<m,pos:riskPos(i,v),text:i.t?i.t(v,r):fmt1(v,i)+i.u,medText:i.m?i.m(m):fmt1(m,i)+i.u}})}
function fmt1(v,i){return i.u==='%'?f1(v):(Math.abs(v)<10&&v%1?f1(v):fmt(v))}
function facetStatus(r,k){const a=items(r,k),w=a.filter(x=>x.worse).length;
  if(a.length<2)return{lv:'資料不足',worse:w,total:a.length};const s=w/a.length;return{lv:s>=.75?'需要關注':s>=.5?'留意':'穩定',worse:w,total:a.length}}
// 全市優先序：v2.5.1 的算法（風險位階 ≥ 90% 的項數；同分看高風險面向數，再看 80 歲以上人數），推估指標不計
const OLD=IND.filter(i=>i.st!=='est'||i.id==='shade');
ALL.forEach(r=>{r.F={};FKEYS.forEach(k=>r.F[k]=facetStatus(r,k));
  r.pts=OLD.filter(i=>{const p=riskPos(i,r.V[i.id]);return p!==null&&p>=.9}).length;
  r.reds=['safe','part'].filter(k=>OLD.filter(i=>i.k===k&&(riskPos(i,r.V[i.id])||0)>=.9).length>=3).length});
[...ALL].sort((a,b)=>b.pts-a.pts||b.reds-a.reds||b.e80-a.e80).forEach((r,i)=>{r.rank=i+1;r.lv=r.rank<=114?'需要關注':r.rank<=228?'留意':'穩定'});

  const r=cur(),SC=scopes(r),TOPIC=topics(r),all=allIdeas(),fl=S.ideaFilter,shown=fl==='全部'?all:all.filter(x=>x.topic.includes(fl));
  const tabs=['全部'].concat(TOPIC).map(t=>{const on=fl===t,c=t==='全部'?all.length:all.filter(x=>x.topic.includes(t)).length;
    return chipBtn('ideaFilter',t,on,`${esc(t)}<span style="min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:${on?'var(--yellow)':'var(--track)'};color:#211D1D">${c}</span>`,`min-height:40px;display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'#211D1D':'var(--chip)'};background:${on?'#211D1D':'#fff'};color:${on?'var(--yellow)':'#211D1D'}`)}).join('');
  const Wm=Object.fromEntries(WHO.map(w=>[w[0],w]));
  const av=(c,sz,t)=>`<span aria-hidden="true" style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};color:#fff;font-size:${Math.round(sz*.42)}px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto">${t}</span>`;
  const bg=['#fff','#FFF1C7','#FBEDE7'];
  const bubbles=shown.length?shown.map((d,i)=>{const w=Wm[d.who[0]]||WHO[3];
    return `<div class="bub" style="display:flex;gap:12px;align-items:flex-start">${av(w[2],40,w[1])}<div style="flex:1 1 auto;min-width:0;background:${bg[i%3]};border-radius:6px 20px 20px 20px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 16px rgba(150,120,20,.08)"><div style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px"><strong>${esc(d.who.join('、'))}</strong><span style="color:var(--sub)">回應「${esc(d.topic.join('、'))}」</span>`
     +d.scope.map(s=>{const sc=SC.find(x=>x[0]===s);return `<span style="font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:${sc[3]};color:${sc[4]}">給${esc(sc[1])}</span>`}).join('')
     +`</div><div style="font-size:16px;line-height:1.6">${esc(d.text)}</div></div></div>`}).join('')
    :'<div style="background:#fff;border-radius:6px 20px 20px 20px;padding:16px;font-size:15px;color:var(--sub)">這個問題還沒有人留言，當第一個吧！</div>';
  const whoBtns=WHO.map(w=>{const on=S.who.includes(w[0]);return chipBtn('who',w[0],on,av(w[2],26,w[1])+w[0],`min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'#211D1D':'var(--chip)'};background:${on?'var(--tint-yellow)':'#fff'};color:#211D1D`)}).join('');
  const topicBtns=TOPIC.map(t=>{const on=S.topic.includes(t);return chipBtn('topic',t,on,esc(t),`min-height:44px;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'var(--brand-deep)':'var(--chip)'};background:${on?'var(--brand-deep)':'#fff'};color:${on?'#fff':'#211D1D'}`)}).join('');
  const scopeBtns=SC.map(s=>{const on=S.scope.includes(s[0]);return chipBtn('scope',s[0],on,`<span style="font-size:15px;font-weight:900">${esc(s[1])}</span><span style="font-size:12px;font-weight:400;opacity:.85">${s[2]}</span>`,`min-height:44px;display:inline-flex;align-items:baseline;gap:6px;padding:8px 16px;border-radius:14px;cursor:pointer;border:1.5px solid ${on?'#211D1D':'var(--chip)'};background:${on?'#211D1D':'#fff'};color:${on?'var(--yellow)':'#211D1D'}`)}).join('');
  document.getElementById('solSec').innerHTML='<span class="ghost" aria-hidden="true" style="color:rgba(150,120,20,.1)">04</span>'+secHead('sol','STEP 04','邀請點子','這里需要你的點子',ICON.spark,'#211D1D','#6B5A12','rgba(33,29,29,.3)','var(--yellow)')
   +'<div style="display:flex;flex-direction:column;gap:8px"><p style="margin:0;font-size:26px;font-weight:900;line-height:1.5">這些問題沒有標準答案，<mark class="mark">最懂這個里的，<span class="nowrap">是住在這裡、</span><span class="nowrap">在這裡服務的人。</span></mark></p><p style="margin:0;font-size:16px;color:var(--sub);line-height:1.7">里民、民眾、民間單位，任何人都可以留下想法。這裡不提供標準答案，讓在地的點子自己長出來。</p></div>'
   +`<div class="cols"><div class="col-all" id="ideas"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="font-size:18px;font-weight:900">大家的點子・<span data-num="ideaTotal">${all.length}</span> 則</span><span class="tag-sim">示範內容為模擬</span></div><div role="group" aria-label="依問題看點子" style="display:flex;flex-wrap:wrap;gap:8px">${tabs}</div>${bubbles}</div>`
   +`<form class="form" onsubmit="return false"><div style="font-size:18px;font-weight:900">換我說說看</div><fieldset><legend>我是 <span class="hint">（可複選）</span></legend><div style="display:flex;flex-wrap:wrap;gap:8px">${whoBtns}</div></fieldset><fieldset><legend>想回應哪些問題 <span class="hint">（可複選）</span></legend><div style="display:flex;flex-wrap:wrap;gap:8px">${topicBtns}</div></fieldset><fieldset><legend>這個點子想給 <span class="hint">（可複選）</span></legend><div style="display:flex;flex-wrap:wrap;gap:8px">${scopeBtns}</div></fieldset>`
   +`<label style="display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:900">你的點子<textarea data-input="draft" rows="4" placeholder="例如：我可以每週陪隔壁長輩去市場；我們店可以借座位給長輩休息……" style="font:inherit;font-weight:400;font-size:16px;line-height:1.6;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;resize:vertical;min-height:110px">${esc(S.draft)}</textarea></label>`
   +`<button type="button" data-act="submitIdea" style="min-height:50px;border-radius:14px;border:0;background:#211D1D;color:var(--yellow);font-size:17px;font-weight:900;cursor:pointer">送出我的點子</button>${S.sent?'<div role="status" style="font-size:14px;color:#6B5A12;font-weight:700">謝謝你！你的點子已經加到左邊。（Demo 不會儲存）</div>':''}</form></div>`;
}
function renderHelp(animate){
  const r=cur(),H=simHelpers(r);
  const stats=HELP_TYPES.map((n,i)=>{const base=H.types[i],add=S.helpAdd[n]||0,c=base==null?(add?add:null):base+add;return{n,c:c!=null&&c<3&&base==null?null:c,added:add>0}});
  const max=Math.max(1,...stats.map(s=>s.c||0));
  const rows=stats.map(s=>`<div style="display:grid;grid-template-columns:132px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px"><span>${s.n}</span><span style="height:12px;background:var(--track);border-radius:6px;overflow:hidden"><span class="${animate?'grow':''}" style="display:block;height:12px;border-radius:6px;background:${s.added?'var(--brand)':'var(--orange)'};width:${s.c?(s.c/max*100).toFixed(1):0}%"></span></span><strong data-helper="${s.n}" style="text-align:right"${s.c==null?' title="少於 3 人不顯示"':''}>${s.c==null?'—':s.c}</strong></div>`).join('');
  const offers=HELP_TYPES.map(n=>{const on=S.helpOffer.includes(n);return chipBtn('offer',n,on,n,`min-height:44px;padding:8px 16px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'var(--brand)':'var(--chip)'};background:${on?'var(--brand)':'#fff'};color:${on?'#fff':'#211D1D'}`)}).join('');
  const avs=[['','var(--orange)','#fff'],['','var(--yellow)','#211D1D'],['','var(--brand)','#fff'],['+','#EFC5AD','#211D1D']].map((a,i)=>`<span style="width:40px;height:40px;border-radius:50%;background:${a[1]};border:3px solid #fff;${i?'margin-left:-12px;':''}display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:${a[2]}">${a[0]}</span>`).join('');
  document.getElementById('helpSec').innerHTML='<span class="ghost" aria-hidden="true" style="color:rgba(219,106,65,.1)">♥</span>'+secHead('helper','STEP 05','這里需要你','成為'+esc(r.v)+'的幫手',ICON.heart,'var(--orange)','var(--brand-text)','rgba(219,106,65,.35)')
   +'<div style="display:flex;flex-direction:column;gap:8px"><p style="margin:0;font-size:26px;font-weight:900;line-height:1.5">不用是專家。<mark class="mark"><span class="nowrap">陪長輩聊天、</span><span class="nowrap">借一個空間、</span><span class="nowrap">颱風後出動整理，</span><span class="nowrap">都是幫忙。</span></mark></p><p style="margin:0;font-size:16px;color:var(--sub);line-height:1.7">留下你可以做的事，里辦公處或在地團體需要時會聯絡你。</p></div>'
   +`<div class="cols"><div class="col-all"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="font-size:18px;font-weight:900">大家可以幫什麼</span><span class="tag-sim">示範內容為模擬</span></div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span aria-hidden="true" style="display:flex">${avs}</span><span style="font-size:16px">已經有 <strong data-num="helperCount" style="font-size:28px;color:var(--brand)">${H.total+S.helpers}</strong> 位幫手</span></div><div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">${rows}</div><div style="font-size:12px;color:var(--muted)">可複選，加總會超過幫手人數；少於 3 人以「—」表示。</div></div>`
   +`<form class="form" onsubmit="return false"><div style="font-size:18px;font-weight:900">我也想幫忙</div><fieldset><legend>我可以 <span class="hint">（可複選）</span></legend><div style="display:flex;flex-wrap:wrap;gap:8px">${offers}</div></fieldset>`
   +`<label style="display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:900">怎麼聯絡你<input type="text" data-input="helpContact" value="${esc(S.helpContact)}" placeholder="稱呼與電話或 LINE" autocomplete="off" style="font:inherit;font-weight:400;font-size:16px;min-height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 14px;background:#fff;color:#211D1D"></label>`
   +`<button type="button" data-act="submitHelper" style="min-height:52px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:17px;font-weight:900;cursor:pointer">我願意幫忙</button>${S.helpSent?`<div role="status" style="font-size:15px;color:#6B5A12;font-weight:700">謝謝你成為${esc(r.v)}的幫手！需要時我們會聯絡你。</div>`:''}`
   +'<div style="font-size:12px;color:var(--muted);line-height:1.6">Demo 不會儲存或傳送任何資料，重新整理就會消失。正式版的聯絡資料只提供給里辦公處與合作團體聯繫用，不會公開。</div></form></div>';
}

/* ===== 資料來源 ===== */
function sources(){
  const rows=IND.map(i=>`<tr><td>${FACET[i.k]}</td><td>${i.n}${i.st==='est'?' '+TAG.est:''}</td><td>${i.f}</td><td>${i.src}</td></tr>`).join('');
  return `<details class="src"><summary>資料來源與計算方式</summary><div class="tblw"><table><thead><tr><th>面向</th><th>指標</th><th>計算</th><th>來源</th></tr></thead><tbody>
   <tr><td>人口</td><td>65、80 歲以上、扶老比、年齡性別</td><td>115 年 9 月；5 年後依 110–115 年 65 歲以上人數線性推估</td><td>臺北市民政局各里人口按年齡分</td></tr>${rows}
   <tr><td>燈號</td><td>全市優先序</td><td>各指標在全市的風險位階 ≥ 90% 的項數排序（同分看高風險面向數、80 歲以上人數）</td><td>本頁計算（與 v2.5.1 相同）</td></tr>
   <tr><td>燈號</td><td>面向燈號</td><td>比全市中位數弱的項數 ÷ 有資料的項數：≥ 3/4 需要關注、≥ 1/2 留意；少於 2 項＝資料不足</td><td>本頁計算</td></tr>
   <tr><td>模擬</td><td>大家的點子、幫手人數</td><td>示意功能；送出只留在畫面上，不儲存、不傳送</td><td>—</td></tr></tbody></table></div>
   <div style="font-size:13px;color:var(--muted);padding-bottom:14px">地圖：內政部國土測繪中心村里界（taiwan-atlas 1:10,000 簡化版）。</div></details>`;
}

/* ===== 渲染與事件 ===== */
function render(){
  document.getElementById('app').innerHTML=header()+(S.view==='city'?cityView():villageView())+sources()
   +'<footer style="font-size:13px;color:var(--muted);line-height:1.7;text-align:center">這里需要你｜解方之一：<a id="toZou" href="/">走這條，一路順！</a>｜臺北市 456 里開放資料計算；標示「推估」「模擬」者見上方說明</footer>';
  try{const z=document.getElementById('toZou'),h=location.hostname;if(!/workers\.dev$/.test(h))z.removeAttribute('href');else if(h.startsWith('zheli-needs-you.'))z.href='https://'+h.replace(/^zheli-needs-you\./,'silver-safe-walk.')+'/'}catch(e){}
  if(S.view==='city')updateStage();else{renderRes(true);renderSol();renderHelp(true)}
}
function setVillage(k){S.village=k;resetForms()}
function goVillageView(){S.view='village';try{history.replaceState(null,'','#village')}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const a=t.getAttribute('data-act');
  switch(a){
   case 'goCity':S.view='city';S.zoom=false;try{history.replaceState(null,'','#')}catch(e){}render();window.scrollTo(0,0);break;
   case 'goDistrict':S.view='city';S.town=cur().d;S.zoom=true;render();window.scrollTo(0,0);break;
   case 'goMine':goVillageView();break;
   case 'goVillage':goVillageView();break;
   case 'pickTown':S.town=t.getAttribute('data-town');S.zoom=true;if(!cur()||cur().d!==S.town)setVillage(topOf(S.town).key);updateStage();document.querySelector('nav[aria-label="位置"]').outerHTML=header().match(/<nav aria-label="位置"[\s\S]*?<\/nav>/)[0];break;
   case 'zoomOut':S.zoom=false;render();break;
   case 'pickVillage':setVillage(t.getAttribute('data-village'));updatePreview();break;
   case 'facet':S.facet=t.getAttribute('data-k');S.allInd=false;renderRes(true);break;
   case 'allInd':S.allInd=!S.allInd;renderRes(true);break;
   case 'togglePyr':S.pyr=!S.pyr;render();document.getElementById('pop').scrollIntoView();break;
   case 'ideaFilter':S.ideaFilter=t.getAttribute('data-v');renderSol();break;
   case 'seeIdeas':S.ideaFilter=t.getAttribute('data-topic');renderSol();break;
   case 'who':S.who=toggle(S.who,t.getAttribute('data-v'),true);S.sent=false;renderSol();break;
   case 'topic':S.topic=toggle(S.topic,t.getAttribute('data-v'),true);S.sent=false;renderSol();break;
   case 'scope':S.scope=toggle(S.scope,t.getAttribute('data-v'),true);S.sent=false;renderSol();break;
   case 'submitIdea':{const txt=S.draft.trim();if(!txt)return;const TP=topics(cur());S.ideas=[{who:S.who.slice(),topic:TP.filter(x=>S.topic.includes(x)),scope:['里','區','市'].filter(x=>S.scope.includes(x)),text:txt}].concat(S.ideas);S.draft='';S.sent=true;renderSol();
     document.querySelectorAll('[data-ideacount]').forEach(el=>{const tp=el.getAttribute('data-ideacount');el.textContent=allIdeas().filter(x=>x.topic.includes(tp)).length});break}
   case 'offer':S.helpOffer=toggle(S.helpOffer,t.getAttribute('data-v'),false);S.helpSent=false;renderHelp(false);break;
   case 'submitHelper':if(!S.helpOffer.length)return;S.helpOffer.forEach(k=>{S.helpAdd[k]=(S.helpAdd[k]||0)+1});S.helpers++;S.helpOffer=[];S.helpContact='';S.helpSent=true;renderHelp(true);break;
   case 'report':alert('Demo：正式版會產出「'+cur().v+'」健檢報告 PDF。');break;
  }
});
document.addEventListener('change',e=>{const a=e.target.getAttribute('data-act');
  if(a==='selVillage'){setVillage(e.target.value);render()}
  else if(a==='selTown'){setVillage(topOf(e.target.value).key);render()}});
document.addEventListener('input',e=>{const k=e.target.getAttribute('data-input');if(k)S[k]=e.target.value});

/* 網址參數：?view=village&town=萬華區&village=柳鄉里&facet=safe&zoom=1&all=1&pyr=1&ideas=…&noanim=1；#village 直接開我的里 */
(function(){const q=new URLSearchParams(location.search);
  const t=q.get('town'),v=q.get('village');S.town=t&&DIST[t]?t:topOf().d;
  const k=v&&BYKEY[(t||'')+'|'+v]?(t+'|'+v):v?(ALL.find(r=>r.v===v)||{}).key:null;
  setVillage(k||topOf(S.town).key);if(!t&&k)S.town=cur().d;
  if(q.get('view')==='village'||location.hash==='#village')S.view='village';
  if(q.get('zoom')==='1')S.zoom=true; if(q.get('facet')&&FACET[q.get('facet')])S.facet=q.get('facet');
  if(q.get('all')==='1')S.allInd=true; if(q.get('pyr')==='1')S.pyr=true; if(q.get('ideas'))S.ideaFilter=q.get('ideas');
  if(q.get('noanim')==='1')document.body.classList.remove('anim')})();
render();
setTimeout(()=>document.body.classList.remove('anim'),1500);
</script>
</body>
</html>
